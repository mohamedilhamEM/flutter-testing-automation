include: package:very_good_analysis/analysis_options.10.0.0.yaml
linter:
  rules:
    public_member_api_docs: false
    lines_longer_than_80_chars: false
    prefer_constructors_over_static_methods: false
    require_trailing_commas: true

formatter:
  page_width: 160
analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
